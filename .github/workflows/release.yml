name: SoulSign Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.3.0"
        required: true
        default: "1.3.0"
        type: string
      tag:
        description: "Release tag. Leave empty to use v<version>"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark this release as pre-release"
        required: false
        default: false
        type: boolean

concurrency:
  group: soulsign-manual-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-ios:
    name: Build SoulSign iOS
    runs-on: macos-26
    timeout-minutes: 70
    env:
      VERSION: ${{ inputs.version }}
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      RUST_TOOLCHAIN: "1.97.1"
      SOURCE_PACKAGES_DIR: build/SourcePackages

    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.2

      - name: Set SoulSign version for this build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("project.yml")
          text = path.read_text(encoding="utf-8")
          version = os.environ["VERSION"]
          build = os.environ["GITHUB_RUN_NUMBER"]
          text = re.sub(r"MARKETING_VERSION: [^\n]+", f"MARKETING_VERSION: {version}", text)
          text = re.sub(r"CURRENT_PROJECT_VERSION: [^\n]+", f"CURRENT_PROJECT_VERSION: {build}", text)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.5.app
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Audit iOS 15 source compatibility
        shell: bash
        run: bash Scripts/audit-ios15-compat.sh

      - name: Restore iOS 15 RustBridge cache
        id: rustbridge-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Vendor/Minimuxer/RustBridge/lib/RustBridge.xcframework
            Vendor/Minimuxer/RustBridge/target
            ~/.cargo/registry
            ~/.cargo/git
          key: soulsign-rustbridge-ios15-${{ runner.arch }}-${{ hashFiles('Vendor/Minimuxer/RustBridge/Cargo.lock', 'Vendor/Minimuxer/RustBridge/src/**', 'Vendor/Minimuxer/RustBridge/Makefile') }}

      - name: Ensure RustBridge supports iOS 15
        id: rustbridge
        shell: bash
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: |
          set -euo pipefail
          # A cache hit skips the rebuild path that used to install llvm-tools.
          # Install the matching inspector even when the XCFramework is reused.
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools-preview
          bash Scripts/ensure-rustbridge.sh
          MAX_IOS_VERSION=15.0 bash Scripts/verify-rustbridge-minos.sh
          bash Scripts/verify-rustbridge-symbols.sh

      - name: Save iOS 15 RustBridge cache
        if: steps.rustbridge-cache.outputs.cache-hit != 'true' && steps.rustbridge.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            Vendor/Minimuxer/RustBridge/lib/RustBridge.xcframework
            Vendor/Minimuxer/RustBridge/target
            ~/.cargo/registry
            ~/.cargo/git
          key: soulsign-rustbridge-ios15-${{ runner.arch }}-${{ hashFiles('Vendor/Minimuxer/RustBridge/Cargo.lock', 'Vendor/Minimuxer/RustBridge/src/**', 'Vendor/Minimuxer/RustBridge/Makefile') }}

      - name: Generate Xcode project
        shell: bash
        run: xcodegen generate

      - name: Verify Xcode deployment targets are iOS 15
        shell: bash
        run: |
          set -euo pipefail
          for target in Seal SealTunnel DeviceSupport; do
            value="$(xcodebuild \
              -project SoulSign.xcodeproj \
              -target "$target" \
              -configuration Release \
              -sdk iphoneos \
              -showBuildSettings | awk -F ' = ' '/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = / { print $2; exit }')"
            echo "$target IPHONEOS_DEPLOYMENT_TARGET=$value"
            test "$value" = "15.0"
          done

      - name: Restore Swift package cache
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: build/SourcePackages
          key: soulsign-spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Vendor/Minimuxer/Package.swift', 'Vendor/rork-sign/Package.swift') }}

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_PACKAGES_DIR"
          xcodebuild -resolvePackageDependencies \
            -project SoulSign.xcodeproj \
            -scheme Seal \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR"

      - name: Save Swift package cache
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/SourcePackages
          key: soulsign-spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Vendor/Minimuxer/Package.swift', 'Vendor/rork-sign/Package.swift') }}

      - name: Build unsigned SoulSign IPA
        shell: bash
        env:
          SEAL_IPA_CONFIGURATION: Release
          SEAL_SKIP_XCODEGEN: "1"
          SEAL_SOURCE_PACKAGES_DIR: ${{ env.SOURCE_PACKAGES_DIR }}
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: bash Scripts/build-unsigned-ipa.sh

      - name: Verify unsigned SoulSign IPA
        shell: bash
        run: bash Scripts/verify-ipa.sh build/SoulSign.ipa

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/SoulSign-source-${VERSION}"
          SOURCE_ZIP="$PWD/build/SoulSign-source-${VERSION}.zip"
          rm -rf "$SOURCE_DIR" "$SOURCE_ZIP" "$SOURCE_ZIP.sha256"
          mkdir -p "$SOURCE_DIR"
          rsync -a --exclude '.git' --exclude 'build' ./ "$SOURCE_DIR/"
          ditto -c -k --sequesterRsrc --keepParent "$SOURCE_DIR" "$SOURCE_ZIP"
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"

      - name: Stage iOS release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-ios
          cp build/SoulSign.ipa release-ios/
          cp build/SoulSign.ipa.sha256 release-ios/
          cp build/SoulSign-Info.plist release-ios/
          cp build/SealTunnel-Info.plist release-ios/
          cp "build/SoulSign-source-${VERSION}.zip" release-ios/
          cp "build/SoulSign-source-${VERSION}.zip.sha256" release-ios/

      - name: Upload iOS release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: soulsign-ios-release
          if-no-files-found: error
          path: release-ios/*
          retention-days: 7

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: SoulSign-xcodebuild-log-${{ github.run_number }}
          if-no-files-found: ignore
          path: build/xcodebuild.log
          retention-days: 7

  build-windows:
    name: Build SoulSign Windows
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      VERSION: ${{ inputs.version }}
      FLUTTER_VERSION: "3.44.8"

    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Windows/build-soulsign-windows.ps1

      - name: Install Python build helper
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows symlink support
        shell: pwsh
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - name: Set up MSYS2 for zsign
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib mingw-w64-x86_64-minizip mingw-w64-x86_64-pkgconf

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build SoulSign PC
        shell: pwsh
        run: |
          .\Windows\build-soulsign-windows.ps1 -Version "$env:VERSION" -OutputDir ".\build\windows"

      - name: Verify Windows release assets
        shell: pwsh
        run: |
          $required = @(
            ".\build\windows\SoulSign-Windows-x64.zip",
            ".\build\windows\SoulSign-Setup-$env:VERSION-x64.exe",
            ".\build\windows\SHA256SUMS.txt"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing Windows release asset: $file" }
            Write-Host "$file -> $((Get-Item $file).Length) bytes"
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: soulsign-windows-release
          if-no-files-found: error
          path: |
            build/windows/SoulSign-Windows-x64.zip
            build/windows/SoulSign-Setup-${{ inputs.version }}-x64.exe
            build/windows/SHA256SUMS.txt
          retention-days: 7

  publish-release:
    name: Publish SoulSign 1.3 dual-platform release
    needs: [build-ios, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
      REQUESTED_TAG: ${{ inputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.2

      - name: Download iOS assets
        uses: actions/download-artifact@v8
        with:
          name: soulsign-ios-release
          path: release-assets

      - name: Download Windows assets
        uses: actions/download-artifact@v8
        with:
          name: soulsign-windows-release
          path: release-assets

      - name: List release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          test -f release-assets/SoulSign.ipa
          test -f release-assets/SoulSign-Windows-x64.zip

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_TAG" ]]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="v$VERSION"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing SoulSign assets."
          else
            args=(release create "$TAG" --title "SoulSign $VERSION" --generate-notes --target "$GITHUB_SHA")
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi

          gh release upload "$TAG" release-assets/* --clobber

          echo
          echo "SoulSign $VERSION published."
          echo "iOS: SoulSign.ipa"
          echo "Windows: SoulSign-Windows-x64.zip"
