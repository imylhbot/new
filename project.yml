name: SoulSign
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
  AltSign:
    url: https://github.com/dmjorb/AltSign
    revision: 868f0ff
  AnisetteKit:
    url: https://github.com/dmjorb/AnisetteKit
    revision: 081200e
  Crypto:
    url: https://github.com/apple/swift-crypto
    exactVersion: 4.5.2
  Minimuxer:
    path: Vendor/Minimuxer
  RorkSign:
    path: Vendor/rork-sign
targets:
  Seal:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Seal
        excludes:
          - "Resources/Anisette/*.so"
    resources:
      - path: Seal/Resources/Anisette
    dependencies:
      - package: ZIPFoundation
      - package: AltSign
        product: AltSign-Static
      - package: AnisetteKit
      - package: Minimuxer
      - package: RorkSign
        product: RorkSign
      - package: Crypto
        product: Crypto
      - package: Crypto
        product: CryptoExtras
      - target: DeviceSupport
      - target: SealTunnel
        embed: true
        codeSign: false
    info:
      path: Seal/Resources/Info.plist
      properties:
        CFBundleDisplayName: SoulSign
        UIDeviceFamily: [1, 2]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SealOriginalBundleIdentifier: com.mjorb.soulsign
        CFBundleURLTypes:
          - CFBundleURLName: com.mjorb.soulsign
            CFBundleURLSchemes:
              - soulsign
              - seal
              - sidestore
        CFBundleDocumentTypes:
          - CFBundleTypeName: IPA Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.apple.itunes.ipa
              - public.zip-archive
              - public.data
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App Archive
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
              public.mime-type:
                - application/octet-stream
                - application/x-itunes-ipa
        ITSAppUsesNonExemptEncryption: false
        SoulSignUpdateRepository: $(SOULSIGN_UPDATE_REPOSITORY)
        NSLocalNetworkUsageDescription: SoulSign 通过本地通道连接此设备并安装应用。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mjorb.soulsign
        PRODUCT_NAME: SoulSign
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 4
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Seal/Resources/Seal.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SOULSIGN_UPDATE_REPOSITORY: ""
  SealTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SealTunnel
        excludes:
          - Info.plist
          - SealTunnel.entitlements
    info:
      path: SealTunnel/Info.plist
      properties:
        CFBundleDisplayName: SoulSign Tunnel
        UIDeviceFamily: [1, 2]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mjorb.soulsign.TunnelProv
        PRODUCT_NAME: SealTunnel
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 4
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SealTunnel/SealTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  DeviceSupport:
    type: library.static
    platform: iOS
    deploymentTarget: "15.0"
    dependencies:
      - package: AltSign
        product: OpenSSL
    sources:
      - path: Vendor/DeviceSupport/libimobiledevice/src
      - path: Vendor/DeviceSupport/libimobiledevice/common
      - path: Vendor/DeviceSupport/libimobiledevice-glue/src
      - path: Vendor/DeviceSupport/libplist/src
      - path: Vendor/DeviceSupport/libplist/libcnary
      - path: Vendor/DeviceSupport/libusbmuxd/src/libusbmuxd.c
    settings:
      base:
        PRODUCT_NAME: imobiledevice
        EXECUTABLE_PREFIX: lib
        SKIP_INSTALL: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_CXX_LANGUAGE_STANDARD: c++14
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        GCC_ENABLE_CPP_RTTI: YES
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - HAVE_CONFIG_H=1
          - HAVE_OPENSSL=1
          - HAVE_STPNCPY=1
          - HAVE_STPCPY=1
          - HAVE_VASPRINTF=1
          - HAVE_ASPRINTF=1
          - HAVE_GETIFADDRS=1
          - HAVE_STRNDUP=1
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/Vendor/DeviceSupport
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libplist/include
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libplist/src
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libplist/libcnary/include
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libimobiledevice
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libimobiledevice/include
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libimobiledevice/src
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libusbmuxd/include
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libimobiledevice-glue/include
  SealTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SealTests
    dependencies:
      - target: Seal
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mjorb.soulsign.tests
        GENERATE_INFOPLIST_FILE: YES
  SealUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SealUITests
    dependencies:
      - target: Seal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mjorb.soulsign.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Seal:
    # Release builds compile only the app dependency graph. Tests stay in the
    # test action and do not slow down manual IPA packaging.
    build:
      targets:
        Seal: all
    test:
      gatherCoverageData: true
      targets:
        - SealTests
        - SealUITests
